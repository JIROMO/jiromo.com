  <body>
    <div class="wrap">
      <header class="site-header">
        <a href="/"><img class="logo" src="/logo.svg" alt="株式会社JIROMO" width="140" height="24" /></a>
        <nav class="site-nav" aria-label="主な項目">
          <a href="/#services">事業内容</a>
          <a href="/works/">制作実績</a>
          <a href="/#company">会社概要</a>
        </nav>
      </header>

      <main class="contact-page">
        <h1>お問い合わせ</h1>
        <p class="contact-lead">
          開発のご相談やお見積りなど、こちらのフォームよりご連絡ください。
        </p>

        <form id="contact-form" class="contact-form" data-sitekey="0x4AAAAAAF2QN27w9dd3GIag" novalidate>
          <div class="field">
            <p class="field-label" id="category-label">ご相談の種類<span class="required">必須</span></p>
            <input type="hidden" id="category" name="category" value="" />
            <div class="picker" id="category-picker">
              <button
                type="button"
                class="picker-button"
                id="category-button"
                role="combobox"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="category-list"
                aria-labelledby="category-label category-value"
              >
                <span class="is-placeholder" id="category-value">選択してください</span>
                <span class="picker-chevron" aria-hidden="true"></span>
              </button>
              <ul class="picker-list" id="category-list" role="listbox" aria-labelledby="category-label" hidden>
                <li role="option" id="category-option-1" data-value="新規開発のご相談" aria-selected="false">新規開発のご相談</li>
                <li role="option" id="category-option-2" data-value="既存システムの改修・機能追加" aria-selected="false">既存システムの改修・機能追加</li>
                <li role="option" id="category-option-3" data-value="Salesforce連携" aria-selected="false">Salesforce連携</li>
                <li role="option" id="category-option-4" data-value="Webサイト・EC" aria-selected="false">Webサイト・EC</li>
                <li role="option" id="category-option-5" data-value="その他" aria-selected="false">その他</li>
              </ul>
            </div>
            <p class="field-error" id="category-error" hidden></p>
          </div>

          <div class="field">
            <label for="name">お名前<span class="required">必須</span></label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required />
            <p class="field-error" id="name-error" hidden></p>
          </div>

          <div class="field">
            <label for="company">会社名</label>
            <input id="company" name="company" type="text" autocomplete="organization" maxlength="100" />
            <p class="field-error" id="company-error" hidden></p>
          </div>

          <div class="field">
            <label for="email">メールアドレス<span class="required">必須</span></label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required />
            <p class="field-error" id="email-error" hidden></p>
          </div>

          <div class="field">
            <label for="phone">電話番号</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" />
            <p class="field-error" id="phone-error" hidden></p>
          </div>

          <div class="field">
            <label for="message">ご相談内容<span class="required">必須</span></label>
            <textarea id="message" name="message" rows="8" maxlength="5000" required></textarea>
            <p class="field-error" id="message-error" hidden></p>
          </div>

          <div class="field-hidden" aria-hidden="true">
            <label for="website">この項目には入力しないでください</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>

          <div class="field">
            <label class="check">
              <input id="privacy" name="privacy" type="checkbox" required />
              <span><a href="/privacy" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します</span>
            </label>
            <p class="field-error" id="privacy-error" hidden></p>
          </div>

          <div id="turnstile" class="turnstile"></div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="form-actions">
            <button class="button primary" type="submit" id="submit" aria-describedby="submit-hint" disabled>送信する</button>
            <p class="submit-hint" id="submit-hint"></p>
          </div>
          <noscript><p class="form-error">送信にはJavaScriptを有効にしてください。</p></noscript>
        </form>

        <div id="contact-done" class="contact-done" tabindex="-1" hidden>
          <h2>お問い合わせを受け付けました</h2>
          <p>内容を確認のうえ、ご連絡いたします。</p>
          <a class="more" href="/">トップへ戻る</a>
        </div>
      </main>

      <footer class="site-footer">
        <a href="/contact/">お問い合わせ</a>
        <a href="/privacy">プライバシーポリシー</a>
        <a href="/terms">利用規約</a>

        <p class="copyright">&copy; JIROMO, inc.</p>
      </footer>
    </div>
